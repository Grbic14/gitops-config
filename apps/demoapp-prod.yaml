apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demoapp-prod
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  source:
    repoURL: https://github.com/Grbic14/gitops-helm-chart.git
    targetRevision: main
    path: charts/demoapp
    helm:
      values: |-
        image:
          repository: nginx
          tag: "1.27"
        replicaCount: 3
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
